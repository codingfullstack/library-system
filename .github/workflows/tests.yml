name: tests

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  fast:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Run Laravel Fast Tests
        run: php artisan test --exclude-group=mysql --exclude-group=database-invariants --exclude-group=concurrency --exclude-group=mariadb

      - name: Run Android Unit Tests
        working-directory: LibraryApp
        run: ./gradlew testDebugUnitTest

  mysql-production-invariants:
    name: MySQL/MariaDB production invariant suite
    runs-on: ubuntu-latest
    environment: Testing
    services:
      mariadb:
        # Production-like LTS target for generated columns, CHECK constraints,
        # real FKs, and InnoDB transaction semantics.
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: library_system_testing
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: library_system_testing
      DB_USERNAME: root
      DB_PASSWORD: password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Verify PDO MySQL Driver
        run: php -r "extension_loaded('pdo_mysql') || exit(1); in_array('mysql', PDO::getAvailableDrivers(), true) || exit(1);"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Node Dependencies
        run: npm i

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Wait For MariaDB
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent && exit 0
            sleep 2
          done
          echo "MariaDB did not become ready in time"
          exit 1

      - name: Show MariaDB Version
        run: mysql -h 127.0.0.1 -uroot -ppassword -e "SELECT VERSION() AS version"

      - name: Prepare Testing Database
        run: |
          mysql -h 127.0.0.1 -uroot -ppassword -e "DROP DATABASE IF EXISTS library_system_testing"
          mysql -h 127.0.0.1 -uroot -ppassword -e "CREATE DATABASE IF NOT EXISTS library_system_testing CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"

      - name: Migrate MariaDB Schema
        run: php artisan migrate:fresh --force

      - name: Reservation Assignment Preflight
        run: php artisan reservations:preflight-assignment-migration

      - name: Run MySQL Production Invariant Suite
        run: php artisan test --group=mysql --fail-on-skipped
